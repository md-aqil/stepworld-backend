databases:
  - name: stepworld
    databaseName: stepworld
    plan: free

services:
  - type: web
    name: stepworld-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stepworld
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
