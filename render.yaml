databases:
  - name: stepworld-db
    databaseName: stepworld
    user: stepworld_user
    plan: free

services:
  # Full-Stack Web Service (Node + Express + Prisma + Frontend SPA)
  - type: web
    name: stepworld-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push --accept-data-loss && (npm run seed:comprehensive || true) && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stepworld-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
