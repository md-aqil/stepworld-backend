databases:
  - name: stepworld-db
    databaseName: stepworld
    user: stepworld_user
    plan: free

services:
  # Full-Stack Web Service (Node + Express + Prisma + Frontend SPA)
  - type: web
    name: stepworld-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed-comprehensive.ts && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stepworld-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
